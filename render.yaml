services:
  - type: web
    name: shopchain-backend
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile
    autoDeployTrigger: 'off'
    healthCheckPath: /shopchain/api/openapi.yml
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: demo
      - key: JWT_SECRET
        generateValue: true
      - key: DEMO_ADMIN_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false

  - type: web
    name: shopchain-frontend
    runtime: static
    branch: main
    rootDir: web_frontend
    buildCommand: npm ci && npm run build:render
    staticPublishPath: dist/web_frontend/browser
    autoDeployTrigger: 'off'
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
