server:
  port: ${PORT:8080}
  servlet:
    context-path: /shopchain
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax

spring:
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/shopchain}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  jackson:
    deserialization:
      fail-on-unknown-properties: true

shopchain:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
