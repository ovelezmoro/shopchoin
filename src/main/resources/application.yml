server:
  port: ${PORT:8080}
  servlet:
    context-path: /shopchain

spring:
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/shopchain}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  jackson:
    deserialization:
      fail-on-unknown-properties: true

shopchain:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:30}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
